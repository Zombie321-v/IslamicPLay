<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IslamicPlay - Luxury Cinematic</title>
    
    <!-- Fonts & Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#59413e", "tertiary-fixed": "#ffdea6", "on-tertiary-fixed-variant": "#5d4200", "on-primary": "#690004", "tertiary-container": "#573d00", "primary-fixed-dim": "#ffb4aa", "on-background": "#e5e2e1", "inverse-surface": "#e5e2e1", "on-secondary-fixed": "#241a00", "surface-dim": "#131313", "primary-fixed": "#ffdad5", "on-secondary-container": "#342800", "surface-variant": "#353534", "primary-container": "#860d0d", "error": "#ffb4ab", "surface": "#131313", "on-secondary": "#3c2f00", "on-tertiary-container": "#dba531", "on-tertiary": "#412d00", "error-container": "#93000a", "primary": "#ffb4aa", "on-primary-fixed-variant": "#8d1412", "surface-container-highest": "#353534", "tertiary-fixed-dim": "#f7bd48", "surface-container-high": "#2a2a2a", "background": "#131313", "on-primary-fixed": "#410001", "on-surface-variant": "#e1bfba", "surface-tint": "#ffb4aa", "surface-container": "#201f1f", "on-surface": "#e5e2e1", "surface-container-lowest": "#0e0e0e", "surface-container-low": "#1c1b1b", "on-tertiary-fixed": "#271900", "on-error": "#690005", "secondary-fixed": "#ffe088", "on-primary-container": "#ff8e81", "tertiary": "#f7bd48", "surface-bright": "#393939", "secondary-fixed-dim": "#e9c349", "secondary": "#e9c349", "outline": "#a88a86", "on-error-container": "#ffdad6", "inverse-primary": "#af2e26", "secondary-container": "#af8d11", "on-secondary-fixed-variant": "#574500", "inverse-on-surface": "#313030"
                    },
                    "fontFamily": {
                        "headline-lg": ["Playfair Display"], "headline-xl": ["Playfair Display"], "headline-md": ["Playfair Display"], "label-sm": ["Montserrat"], "body-lg": ["Newsreader"], "body-md": ["Newsreader"]
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --tx: 0px;
            --ty: 0px;
        }

        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            color: white;
            min-height: 100vh;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Hero Background Layers */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            perspective: 1000px;
            transition: transform 0.1s ease-out;
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 105%;
            min-height: 105%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%) scale(1.08);
            opacity: 0;
            object-fit: cover;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.8s ease;
            filter: blur(10px) brightness(0.8);
        }

        .bg-video.active-video {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            filter: blur(0px) brightness(1.1) drop-shadow(0 0 20px rgba(255, 255, 255, 0.1));
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.04;
            mix-blend-mode: overlay;
            z-index: 10;
            pointer-events: none;
        }

        /* Hero UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        .navbar {
            width: 90%;
            max-width: 1200px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .store-name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            letter-spacing: 6px;
            margin: 0;
            font-weight: 400;
            color: var(--gold-light);
            text-shadow: 0 0 20px var(--gold-glow);
            animation: textFloat 6s ease-in-out infinite;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Bubble Selector */
        .selector-container {
            display: flex;
            gap: 40px;
            margin-top: 60px;
            pointer-events: auto;
        }

        .bubble-wrapper {
            position: relative;
            animation: antiGravityFloat 4s ease-in-out infinite alternate;
            will-change: transform;
        }
        
        .bubble-wrapper:nth-child(2) {
            animation-delay: -2s;
            animation-duration: 4.5s;
        }

        .bubble-selector {
            position: relative;
            width: 120px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 0 10px rgba(212, 175, 55, 0.05);
            transition: box-shadow 0.4s ease, border-color 0.4s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(var(--tx), var(--ty));
            overflow: hidden;
        }

        .bubble-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1;
        }

        .bubble-text {
            position: relative;
            z-index: 3;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            transition: color 0.3s ease;
        }

        .bubble-wrapper.active .bubble-selector {
            border-color: var(--gold);
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px var(--gold-glow);
            background: rgba(212, 175, 55, 0.05);
        }

        .bubble-wrapper.active .bubble-text {
            color: var(--gold-light);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .bubble-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            z-index: 2;
            transition: none;
        }

        .bubble-selector:hover .bubble-shine {
            left: 150%;
            transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ripple-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 30px;
            pointer-events: none;
            z-index: 0;
        }

        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 30px;
            background: var(--gold);
            opacity: 0.4;
            animation: rippleEffect 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        /* Particles & Cinematic */
        .dust-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px var(--gold-light);
        }

        .cinematic-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(212,175,55,0.15) 50%, rgba(255,255,255,0) 100%);
            opacity: 0;
            z-index: 15;
            pointer-events: none;
            transform: translateX(-100%);
        }

        .flash-active {
            animation: sweep 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 60%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: screen;
            transition: width 0.3s, height 0.3s;
        }

        /* Animations */
        @keyframes antiGravityFloat {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(3px, -5px) rotate(1deg); }
            50% { transform: translate(-2px, 4px) rotate(-1deg); }
            75% { transform: translate(-4px, -3px) rotate(0.5deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 20px var(--gold-glow); }
            50% { transform: translateY(-4px); text-shadow: 0 0 30px var(--gold-light); }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.8; transform: translateY(80vh) scale(1); }
            80% { opacity: 0.8; transform: translateY(20vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        @keyframes rippleEffect {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        .reveal-on-scroll { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-on-scroll.revealed { opacity: 1; transform: translateY(0); }

        @keyframes sectionFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .quran-section {
            display: none;
        }
        .quran-section.active-section {
            display: block;
            animation: sectionFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        <!-- INJECT_CSS -->
    </style>
</head>
<body class="bg-surface text-on-background selection:bg-secondary/30">
    <header class="relative w-full h-screen overflow-hidden">
        <div class="noise-overlay"></div>
        <div class="dust-particles" id="particles"></div>
        <div class="cursor-glow" id="cursorGlow"></div>
        <div class="cinematic-flash" id="flashSweep"></div>

        <div class="video-container" id="videoContainer">
            <video id="video1" class="bg-video active-video" src="Luxury_Quran_in_mosque_202605101551.mp4" autoplay loop muted playsinline></video>
            <video id="video2" class="bg-video" src="Luxury_Quran_book_commercial_202605101545.mp4" autoplay loop muted playsinline></video>
            <div class="vignette"></div>
        </div>

        <div class="ui-layer" id="uiLayer">
            <nav class="navbar">
                <div class="nav-links">
                    <a href="#" class="nav-link">Home</a>
                    <a href="#quran1" class="nav-link">Black & Gold</a>
                </div>
                <div class="brand">
                    <h1 class="store-name">ISLAMICPLAY</h1>
                </div>
                <div class="nav-links">
                    <a href="#quran2" class="nav-link">Red & Gold</a>
                    <a href="#" class="nav-link">Contact</a>
                </div>
            </nav>

            <div class="selector-container">
                <div class="bubble-wrapper active" id="wrap1">
                    <div class="bubble-selector" id="btn1" data-target="video1">
                        <div class="bubble-bg"></div>
                        <div class="bubble-shine"></div>
                        <span class="bubble-text">Quran 1</span>
                        <div class="ripple-container"></div>
                    </div>
                </div>
                <div class="bubble-wrapper" id="wrap2">
                    <div class="bubble-selector" id="btn2" data-target="video2">
                        <div class="bubble-bg"></div>
                        <div class="bubble-shine"></div>
                        <span class="bubble-text">Quran 2</span>
                        <div class="ripple-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- INJECT_BODY -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Scroll Reveal Observer
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                    }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
            
            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));

            // Hero Video & Bubble Interaction
            const wrappers = document.querySelectorAll('.bubble-wrapper');
            const videos = {
                video1: document.getElementById('video1'),
                video2: document.getElementById('video2')
            };
            const flash = document.getElementById('flashSweep');

            Object.values(videos).forEach(vid => {
                if (!vid.classList.contains('active-video')) {
                    vid.pause();
                }
            });

            wrappers.forEach(wrap => {
                const btn = wrap.querySelector('.bubble-selector');
                
                btn.addEventListener('click', () => {
                    if (wrap.classList.contains('active')) return;

                    const ripple = document.createElement('div');
                    ripple.classList.add('ripple');
                    btn.querySelector('.ripple-container').appendChild(ripple);
                    setTimeout(() => ripple.remove(), 800);

                    wrappers.forEach(w => w.classList.remove('active'));
                    wrap.classList.add('active');

                    const targetId = btn.getAttribute('data-target');
                    
                    const section1 = document.getElementById('quran1-content');
                    const section2 = document.getElementById('quran2-content');
                    if(targetId === 'video1') {
                        if(section2) section2.classList.remove('active-section');
                        if(section1) section1.classList.add('active-section');
                    } else {
                        if(section1) section1.classList.remove('active-section');
                        if(section2) section2.classList.add('active-section');
                    }
                    
                    flash.classList.remove('flash-active');
                    void flash.offsetWidth; 
                    flash.classList.add('flash-active');

                    Object.keys(videos).forEach(key => {
                        const vid = videos[key];
                        if (key === targetId) {
                            vid.classList.add('active-video');
                            vid.play();
                        } else {
                            vid.classList.remove('active-video');
                            setTimeout(() => vid.pause(), 1000);
                        }
                    });
                });
            });

            // Parallax Cursor Glow
            const cursorGlow = document.getElementById('cursorGlow');
            const uiLayer = document.getElementById('uiLayer');
            const videoContainer = document.getElementById('videoContainer');
            
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetX = mouseX;
            let targetY = mouseY;

            window.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });

            function lerp(start, end, factor) {
                return start + (end - start) * factor;
            }

            function animate() {
                // Ensure we only animate parallax if hero is visible to save CPU
                if(window.scrollY > window.innerHeight) {
                    requestAnimationFrame(animate);
                    return;
                }

                mouseX = lerp(mouseX, targetX, 0.08);
                mouseY = lerp(mouseY, targetY, 0.08);
                
                cursorGlow.style.left = `${mouseX}px`;
                cursorGlow.style.top = `${mouseY}px`;

                const tiltX = (window.innerWidth / 2 - mouseX) * 0.015;
                const tiltY = (window.innerHeight / 2 - mouseY) * 0.015;
                uiLayer.style.transform = `perspective(1000px) rotateY(${tiltX}deg) rotateX(${-tiltY}deg)`;
                
                const bgMoveX = (window.innerWidth / 2 - mouseX) * 0.01;
                const bgMoveY = (window.innerHeight / 2 - mouseY) * 0.01;
                videoContainer.style.transform = `translate(${bgMoveX}px, ${bgMoveY}px) scale(1.02)`;

                wrappers.forEach(wrap => {
                    const btn = wrap.querySelector('.bubble-selector');
                    const rect = wrap.getBoundingClientRect();
                    const btnX = rect.left + rect.width / 2;
                    const btnY = rect.top + rect.height / 2;
                    
                    const dist = Math.hypot(mouseX - btnX, mouseY - btnY);
                    
                    let dx = 0;
                    let dy = 0;

                    if (dist < 180 && dist > 60) {
                        const force = (180 - dist) / 120; 
                        dx = ((btnX - mouseX) / dist) * force * 15;
                        dy = ((btnY - mouseY) / dist) * force * 15;
                    } else if (dist <= 60) {
                        const force = (60 - dist) / 60;
                        dx = (mouseX - btnX) * force * 0.4;
                        dy = (mouseY - btnY) * force * 0.4;
                    }

                    btn.style.setProperty('--tx', `${dx}px`);
                    btn.style.setProperty('--ty', `${dy}px`);
                });

                requestAnimationFrame(animate);
            }
            animate();

            // Floating Dust Particles
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                
                const size = Math.random() * 2 + 1;
                const left = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = Math.random() * 15 + 15;

                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${left}%`;
                p.style.animationDelay = `${delay}s`;
                p.style.animationDuration = `${duration}s`;

                particlesContainer.appendChild(p);
            }
        });
    </script>
</body>
</html>
